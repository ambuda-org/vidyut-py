[package]
name = "vidyut-py"
version = "0.3.0"
edition = "2021"

[lib]
name = "vidyut"
crate-type = ["cdylib"]

[dependencies]
vidyut-chandas = { git = "https://github.com/ambuda-org/vidyut", rev = "ea4112af" }
vidyut-cheda = { git = "https://github.com/ambuda-org/vidyut", rev = "ea4112af" }
vidyut-kosha = { git = "https://github.com/ambuda-org/vidyut", rev = "ea4112af" }
vidyut-lipi = { git = "https://github.com/ambuda-org/vidyut", rev = "ea4112af" }
vidyut-prakriya = { git = "https://github.com/ambuda-org/vidyut", rev = "ea4112af" }
vidyut-sandhi = { git = "https://github.com/ambuda-org/vidyut", rev = "ea4112af" }

[dependencies.pyo3]
version = "0.22.5"
features = ["extension-module", "abi3-py37"]

[package.metadata.maturin]
name = "vidyut"
